name: Reels Auto Upload - TR1

on:
  schedule:
    - cron: '0 6 * * *'   # 15:00 KST, 하루 1개만 업로드
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      target:
        description: '지정 업로드할 제목 (비우면 랜덤)'
        required: false
        default: ''

concurrency:
  group: reels-tr1-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 설정 파일 생성
        env:
          CONFIG_B64: ${{ secrets.REELS_CONFIG }}
        run: echo "$CONFIG_B64" | tr -d '[:space:]' | base64 -d > reels_config.py

      - name: 릴스 업로드 실행
        run: |
          set +e
          python reels_upload.py tr1 "${{ github.event.inputs.target }}"
          code=$?
          set -e
          if [ $code -eq 0 ]; then ok=1; fail=0; else ok=0; fail=1; fi
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\":\"릴스업로드 - TR1 ${ok}개 업로드 완료, ${fail}개 실패\"}" \
              "$DISCORD_WEBHOOK"
          fi
          exit $code
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
