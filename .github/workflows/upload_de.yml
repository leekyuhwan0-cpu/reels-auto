name: Reels Auto Upload - DE

on:
  # schedule 미설정 (2026-08-03): DE Drive 소스 폴더가 아직 비어있음. 콘텐츠 채운 후 schedule 추가.
  # schedule:
  #   - cron: '0 7 * * *'   # 16:00 KST, 하루 1개만 업로드
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      target:
        description: '지정 업로드할 번호 (비우면 랜덤)'
        required: false
        default: ''

concurrency:
  group: reels-de-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 설정 파일 생성
        env:
          CONFIG_B64: ${{ secrets.REELS_CONFIG }}
        run: echo "$CONFIG_B64" | tr -d '[:space:]' | base64 -d > reels_config.py

      - name: 릴스 업로드 실행
        run: python reels_upload.py de "${{ github.event.inputs.target }}"
